spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.platform.notification.domain.event.AnalysisCompletedEvent
        spring.json.trusted.packages: com.platform.notification.domain.event
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notification_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    enabled: false

server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFNpZ25pbmdXaXRoSFMyNTZBbGdvcml0aG0xMjM0NTY3ODk=}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

app:
  kafka:
    topic:
      analysis-completed: analysis-completed
      notification-created: notification-created
    consumer:
      group-id: notification-service-group

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
