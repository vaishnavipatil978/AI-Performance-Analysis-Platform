spring:
  application:
    name: analysis-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.platform.analysis.domain.event.ReportUploadedEvent
        spring.json.trusted.packages: com.platform.analysis.domain.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/analysis_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    enabled: false
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:your-openrouter-api-key}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: ${AI_MODEL:anthropic/claude-3.5-sonnet}
          temperature: 0.3
          max-tokens: 4096

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFNpZ25pbmdXaXRoSFMyNTZBbGdvcml0aG0xMjM0NTY3ODk=}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

app:
  kafka:
    topic:
      report-uploaded: report-uploaded
      analysis-completed: analysis-completed
    consumer:
      group-id: analysis-service-group
  ai:
    retry-attempts: 3
    retry-delay-ms: 2000
    cache-ttl-minutes: 60

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
