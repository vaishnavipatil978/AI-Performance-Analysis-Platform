spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service-auth
            uri: lb://user-service
            predicates:
              - Path=/api/auth/**
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/api/users/**
          - id: report-service
            uri: lb://report-service
            predicates:
              - Path=/api/reports/**, /api/dashboard/**
          - id: analysis-service
            uri: lb://analysis-service
            predicates:
              - Path=/api/analyses/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/notifications/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFNpZ25pbmdXaXRoSFMyNTZBbGdvcml0aG0xMjM0NTY3ODk=}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
